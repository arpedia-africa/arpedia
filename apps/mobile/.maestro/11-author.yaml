# Flow 11: a reader applies to become an author (4 steps, pasted sample), then the seeded approved
# author Ifeoma submits a book through the 5 submit steps to the Submitted screen.
# Needs the local stack (Supabase + api Worker) behind the app, seeded with `pnpm db:reset`, and two
# files in the phone's Download folder, since the document and image pickers are the system's: any
# small EPUB with a few chapters and any portrait JPG, pushed as
#   adb -s <serial> push <book>.epub /sdcard/Download/maestro-book.epub
#   adb -s <serial> push <cover>.jpg /sdcard/Download/maestro-cover.jpg
#   adb -s <serial> shell content call --method scan_volume --uri content://media --arg external_primary
# (the cover must be the newest photo on the device: the photo picker has no file names)
# Run: maestro test apps/mobile/.maestro/11-author.yaml -e WIDTH=375
# All widths: node tools/maestro-widths.mjs apps/mobile/.maestro/11-author.yaml
appId: com.arpedia.reader
---
# ─── Apply (seeded reader Ngozi) ─────────────────────────────────────────────
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 30000
- tapOn: 'you@example.com'
- eraseText: 40
- inputText: 'ngozi@example.com'
- tapOn: 'Your password'
- eraseText: 40
- inputText: 'arpedia-local'
- hideKeyboard
- tapOn: 'Log in'
- tapOn:
    text: 'Don.t allow'
    optional: true
- extendedWaitUntil:
    visible: 'Home'
    timeout: 30000
- openLink: arpedia://become-author
- extendedWaitUntil:
    visible: 'Share your stories with Arpedia readers.'
    timeout: 15000
- takeScreenshot: author-${WIDTH}-become
# The first width applies; later widths on the same database see it already sent (rule 7).
- runFlow:
    when:
      visible: 'Start application'
    commands:
      - tapOn: 'Start application'

      # s-apply (1 of 4): name and email carry over; date of birth and state (Default Q3)
      - extendedWaitUntil:
          visible: 'Your author profile'
          timeout: 15000
      - tapOn: 'DD / MM / YYYY'
      - eraseText: 40
      - inputText: '12031990'
      - hideKeyboard
      - tapOn: 'Where you live, e.g. Enugu'
      - eraseText: 40
      - inputText: 'Enugu'
      - hideKeyboard
      - takeScreenshot: author-${WIDTH}-apply-1
      - tapOn: 'Continue'

      # s-apply-2
      - assertVisible: 'Your writing'
      - tapOn: 'African stories'
      - tapOn:
          below: 'Short bio'
      - eraseText: 40
      - inputText: 'I write about faith, family and the small mercies of city life.'
      - hideKeyboard
      - takeScreenshot: author-${WIDTH}-apply-2
      - tapOn: 'Continue'

      # s-apply-3: paste a sample instead of a file
      - assertVisible: 'Writing sample'
      - tapOn: 'Paste a chapter or a few pages'
      - eraseText: 40
      - inputText: 'Before the cocks had finished their quarrel, Mama Nkechi was already on the road to the market.'
      - hideKeyboard
      - takeScreenshot: author-${WIDTH}-apply-3
      - tapOn: 'Continue'

      # s-apply-4
      - assertVisible: 'Review and send'
      - tapOn: 'I agree'
      - takeScreenshot: author-${WIDTH}-apply-4
      - tapOn: 'Send application'
      - extendedWaitUntil:
          visible: 'Application received'
          timeout: 30000
      - takeScreenshot: author-${WIDTH}-apply-sent
- runFlow:
    when:
      notVisible: 'Application received'
    commands:
      - assertVisible: 'Sent · we.ll reply by.*'

# ─── Submit a book (seeded approved author Ifeoma) ───────────────────────────
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 30000
- tapOn: 'you@example.com'
- eraseText: 40
- inputText: 'ifeoma@example.com'
- tapOn: 'Your password'
- eraseText: 40
- inputText: 'arpedia-local'
- hideKeyboard
- tapOn: 'Log in'
- tapOn:
    text: 'Don.t allow'
    optional: true
- extendedWaitUntil:
    visible: 'Home'
    timeout: 30000
- openLink: arpedia://studio
- extendedWaitUntil:
    visible: 'Author Studio'
    timeout: 15000
- tapOn: 'Submit a book for review'

# s-studio-submit (1 of 5): EPUB goes straight to the Worker check
- assertVisible: 'Upload your book'
- tapOn: 'EPUB'
- tapOn: 'Choose your file'
- tapOn: 'maestro-book.epub'
- tapOn: 'Add cover image'
# Android's photo picker shows thumbnails, not file names: the pushed cover is the newest photo.
- tapOn:
    text: 'Photo taken on.*'
    index: 0
# Android 16's picker selects on tap and waits for Done, even in single-pick mode.
- tapOn:
    text: 'Done'
    optional: true
# Genres and Description sit below the fold once the file and cover cards are filled.
- scrollUntilVisible:
    element: 'Fiction'
- tapOn: 'Fiction'
- scrollUntilVisible:
    element: 'Two or three sentences readers see first'
- tapOn: 'Two or three sentences readers see first'
- eraseText: 40
- inputText: 'A market woman, a debt remembered and one long day in Onitsha.'
- hideKeyboard
- takeScreenshot: author-${WIDTH}-submit
- tapOn: 'Continue'

# s-studio-processing (2 of 5)
- extendedWaitUntil:
    visible: 'Getting your book ready'
    timeout: 60000
- takeScreenshot: author-${WIDTH}-processing
- extendedWaitUntil:
    visible: 'Chapters are ready'
    timeout: 180000
- tapOn: 'Chapters are ready'

# s-studio-chapters (3 of 5)
- extendedWaitUntil:
    visible: 'Check your chapters'
    timeout: 15000
- takeScreenshot: author-${WIDTH}-chapters
- tapOn: 'Looks right, continue'

# s-studio-preview (4 of 5)
- extendedWaitUntil:
    visible: 'Preview on a phone'
    timeout: 30000
- scrollUntilVisible:
    element: 'I agree'
- tapOn: 'I agree'
- takeScreenshot: author-${WIDTH}-preview
- tapOn: 'Submit for review'

# s-studio-submitted (5 of 5)
- extendedWaitUntil:
    visible: '.* is in!'
    timeout: 30000
- takeScreenshot: author-${WIDTH}-submitted
- tapOn: 'Back to My books'
- assertVisible: 'In review'
