# Flow 03: sign in as Ngozi (840 credits, Quarterly), open Harmattan Letters, Unlock all,
# see the toast and the Unlocked state. Opening the reader past 10% joins this flow with flow 04.
# Needs the local stack (Supabase + api Worker) behind the app, freshly reset (`pnpm db:reset`):
# the first width unlocks the book, the next widths see it already unlocked.
# Run: maestro test apps/mobile/.maestro/03-unlock.yaml -e WIDTH=375
# All widths: node tools/maestro-widths.mjs apps/mobile/.maestro/03-unlock.yaml
appId: com.arpedia.reader
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 30000
- tapOn: 'you@example.com'
- inputText: 'ngozi@example.com'
- tapOn: 'Your password'
- inputText: 'arpedia-local'
- hideKeyboard
- tapOn: 'Log in'
- tapOn:
    text: 'Don.t allow'
    optional: true
- extendedWaitUntil:
    visible: 'Home'
    timeout: 30000

# s-book (Harmattan Letters, seed id …c000-000000000001)
- openLink: arpedia://book/00000000-0000-4000-c000-000000000001
- extendedWaitUntil:
    visible: 'Harmattan Letters'
    timeout: 30000
- takeScreenshot: unlock-${WIDTH}-book

# Unlock all: money is stated before the tap; double tap must charge once (idempotency key).
# The balance line shows only while the book is not owned (later widths see it unlocked).
- runFlow:
    when:
      visible: 'Unlock all'
    commands:
      - assertVisible: 'Your balance.*'
      - tapOn: 'Unlock all, .*'
      - extendedWaitUntil:
          visible: 'Unlock for 125 credits'
          timeout: 10000
      - assertVisible: 'After unlock'
      - takeScreenshot: unlock-${WIDTH}-sheet
      - doubleTapOn: 'Unlock for 125 credits'
      # The toast is best-effort: Maestro can spend longer than the toast's life waiting for the
      # double tap to settle. Charging once per key is covered by pgTAP (03_unlock_test.sql).
      # `.` for the middle dot: Maestro on Windows reads the file as cp1252.
      - assertVisible:
          text: 'Unlocked . .* credits left'
          optional: true

- extendedWaitUntil:
    visible: 'Unlocked'
    timeout: 20000
- assertNotVisible: 'Unlock all'
- takeScreenshot: unlock-${WIDTH}-owned
