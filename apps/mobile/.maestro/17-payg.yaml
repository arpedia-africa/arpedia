# Flow 17 rule 10 · Pay as you read: the seeded reader Ngozi reads A House Called Grace past the free
# preview with Pay as you read, a chapter is charged, she undoes it within 10 minutes, reads on (charged
# again) and then pays the rest from the book page. `node tools/journeys/run.mjs payg` (fresh reset), then
# tools/journeys/staff.mjs check-undo proves the undo row and the money check proves the ledger.
# `.` stands for the middle dot in patterns: Maestro on Windows reads the file as cp1252.
appId: com.arpedia.reader
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 90000
- tapOn: 'you@example.com'
- inputText: 'ngozi@example.com'
- tapOn: 'Your password'
- inputText: 'arpedia-local'
- hideKeyboard
- tapOn: 'Log in'
- tapOn:
    text: 'Don.t allow'
    optional: true
- extendedWaitUntil:
    visible: 'Good .*, Ngozi.*'
    timeout: 30000

# ─── Read to the end of the preview, choose Pay as you read ─────────────────
- openLink: arpedia://read/00000000-0000-4000-c000-000000000003
- extendedWaitUntil:
    visible: '\d+%'
    timeout: 30000
- tapOn:
    text: 'OK'
    optional: true
- repeat:
    while:
      notVisible: 'You.ve read the free .*'
    times: 80
    commands:
      - swipe:
          direction: LEFT
          duration: 200
- tapOn: 'Pay as you read . about .* a chapter'
- extendedWaitUntil:
    visible: 'Start reading'
    timeout: 10000
- assertVisible: 'Most you.ll ever pay'
- takeScreenshot: payg-${WIDTH}-choose
- tapOn: 'Start reading'

# ─── The first locked chapter is charged; Undo it from the toast ────────────
# The toast lives 8 s and one hierarchy read can take seconds, so tap Undo the moment it shows.
- evalScript: ${output.undone = false}
- repeat:
    while:
      true: ${!output.undone}
    times: 40
    commands:
      - swipe:
          direction: LEFT
          duration: 200
      - repeat:
          while:
            true: ${!output.undone}
          times: 2
          commands:
            - runFlow:
                when:
                  visible: 'Undo'
                commands:
                  - tapOn: 'Undo'
                  - takeScreenshot: payg-${WIDTH}-undo-tapped
                  - evalScript: ${output.undone = true}
- assertTrue: ${output.undone}
# The reader confirms with a notice: "Chapter n returned . n credits back".
- extendedWaitUntil:
    visible: 'Chapter .* returned . .* credits back'
    timeout: 15000
- takeScreenshot: payg-${WIDTH}-undone

# ─── Read on: charged again (Auto-unlock is on) ─────────────────────────────
- repeat:
    while:
      notVisible: 'Chapter .* unlocked . .* credits'
    times: 40
    commands:
      - swipe:
          direction: LEFT
          duration: 200
- back

# ─── Pay the rest from the book page (money stated before the tap) ──────────
- openLink: arpedia://book/00000000-0000-4000-c000-000000000003
- extendedWaitUntil:
    visible: 'Pay the rest . .* credits'
    timeout: 30000
- assertVisible: 'Paid .* of .* Pay the rest .*'
- takeScreenshot: payg-${WIDTH}-book
- tapOn: 'Pay the rest . .* credits'
- extendedWaitUntil:
    visible: 'Left to pay'
    timeout: 10000
# "Price" on the book page's sheet, "Book price" on the Library's.
- assertVisible: '(Book p|P)rice'
- assertVisible: 'Already paid'
- takeScreenshot: payg-${WIDTH}-pay-rest
- tapOn: 'Pay .* credits'
- extendedWaitUntil:
    visible: 'Unlocked'
    timeout: 30000
- assertNotVisible: 'Pay the rest.*'
- takeScreenshot: payg-${WIDTH}-owned
