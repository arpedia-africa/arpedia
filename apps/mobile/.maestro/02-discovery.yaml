# Flow 02: sign in as the seeded reader, tap a Trending book, go back, search "grace",
# open the top result. A book tap opens the book page (flow 03).
# Needs the local stack (Supabase, seeded) behind the app.
# Run: maestro test apps/mobile/.maestro/02-discovery.yaml -e WIDTH=375
# All widths: node tools/maestro-widths.mjs apps/mobile/.maestro/02-discovery.yaml
appId: com.arpedia.reader
---
# On MIUI the typed email is sometimes lost (the field shows its placeholder again), so check it
# and start over if it is missing.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: 'Welcome back'
          timeout: 30000
      - tapOn: 'you@example.com'
      - inputText: 'ngozi@example.com'
      - tapOn: 'Your password'
      - inputText: 'arpedia-local'
      # Tap the heading to drop the keyboard: on MIUI hideKeyboard sends Back, which closes the app
      # when the keyboard is already down.
      - tapOn: 'Welcome back'
      - assertVisible: 'ngozi@example.com'
- tapOn: 'Log in'
- tapOn:
    text: 'Don.t allow'
    optional: true

# s-home
- extendedWaitUntil:
    visible: 'Trending this week'
    timeout: 30000
- assertVisible: 'Good (morning|afternoon|evening), Ngozi\.'
- takeScreenshot: disc-${WIDTH}-home
- tapOn: 'Harmattan Letters by .*'
- extendedWaitUntil:
    visible: 'Save to library'
    timeout: 30000
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'Trending this week'
    timeout: 10000

# s-see-all (Top 10)
# The Top 10 rail carries the heading as its label and is wider than the screen, so scroll to the
# band's subtitle instead. Home keeps animating (rails, petals), so cap the settle wait: otherwise
# each swipe waits ~19 s for a still screen and the scroll times out after one swipe. Slow, short
# swipes and half visibility: at 320 dp a full-speed swipe flung the subtitle past the screen.
- scrollUntilVisible:
    element: 'Most read on Arpedia this week'
    direction: DOWN
    speed: 20
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 60000
# Its See all sits on the heading row, beside the "Top 10 books" heading. (`above`/`below` picked
# New arrivals' See all: they don't choose the nearest match.)
- tapOn:
    text: 'See all'
    childOf:
      containsChild: 'Top 10 books'
- extendedWaitUntil:
    notVisible: 'Coming soon'
    timeout: 15000
- extendedWaitUntil:
    visible: 'Most read on Arpedia this week'
    timeout: 15000
- takeScreenshot: disc-${WIDTH}-top10
- back

# s-search → typing → results → top result
- scrollUntilVisible:
    element: 'Search books, authors, topics'
    direction: UP
    waitToSettleTimeoutMs: 1000
    timeout: 60000
- tapOn: 'Search books, authors, topics'
- extendedWaitUntil:
    visible: 'Trending searches'
    timeout: 15000
- takeScreenshot: disc-${WIDTH}-search
- inputText: 'grace'
- extendedWaitUntil:
    visible: 'Search for grace'
    timeout: 10000
- takeScreenshot: disc-${WIDTH}-typing
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Top result.*'
    timeout: 15000
- takeScreenshot: disc-${WIDTH}-results
- tapOn: 'Top result.*'
- extendedWaitUntil:
    visible: 'Save to library'
    timeout: 30000
- tapOn: 'Back'
- extendedWaitUntil:
    visible: 'Clear search'
    timeout: 10000

# s-search-none → Ask for this book → Request sent
- tapOn: 'Clear search'
- inputText: 'things fall apart'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Ask for this book'
    timeout: 15000
- takeScreenshot: disc-${WIDTH}-none
- tapOn: 'Ask for this book'
- extendedWaitUntil:
    visible: 'Request sent'
    timeout: 10000
- takeScreenshot: disc-${WIDTH}-request
- tapOn: 'Done'
