# Flow 17 rule 10 · Account: the seeded reader Ngozi (Quarterly on Google Play) asks for a copy of her
# data from Settings, then deletes her account: the Play billing warning shows, DELETE confirms, and she
# lands on Log in and can't sign back in. `node tools/journeys/run.mjs account` (fresh reset), then
# tools/journeys/staff.mjs check-deleted proves the deletion, the sign-out and the export email.
appId: com.arpedia.reader
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 90000
- tapOn: 'you@example.com'
- inputText: 'ngozi@example.com'
- tapOn: 'Your password'
- inputText: 'arpedia-local'
- hideKeyboard
- tapOn: 'Log in'
- tapOn:
    text: 'Don.t allow'
    optional: true
- extendedWaitUntil:
    visible: 'Good .*, Ngozi.*'
    timeout: 30000

# ─── Export my data (Settings) ──────────────────────────────────────────────
- tapOn: 'Profile'
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'Edit profile'
    timeout: 30000
- assertVisible: 'Export my data'
- takeScreenshot: account-${WIDTH}-settings
- tapOn: 'Export my data'
- extendedWaitUntil:
    visible: 'We.ll email a copy of your data to ngozi@example.com'
    timeout: 20000
- takeScreenshot: account-${WIDTH}-exported

# ─── Delete account ─────────────────────────────────────────────────────────
- repeat:
    times: 8
    while:
      notVisible: 'Delete account'
    commands:
      - swipe:
          direction: UP
          duration: 600
- tapOn: 'Delete account'
- extendedWaitUntil:
    visible: 'Type DELETE to confirm'
    timeout: 15000
# Her Quarterly plan is on Google Play: the warning says it keeps billing until cancelled there.
- assertVisible: 'Your .* plan keeps billing until you cancel it in Google Play.*'
- takeScreenshot: account-${WIDTH}-delete
- tapOn: 'Type DELETE to confirm'
- inputText: 'DELETE'
- tapOn: 'Delete my account'
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 30000
- takeScreenshot: account-${WIDTH}-deleted

# She can't sign back in.
- tapOn: 'you@example.com'
- inputText: 'ngozi@example.com'
- tapOn: 'Your password'
- inputText: 'arpedia-local'
- hideKeyboard
- tapOn: 'Log in'
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: 'Welcome back'
- assertNotVisible: 'Good .*, Ngozi.*'
- takeScreenshot: account-${WIDTH}-sign-in-refused
