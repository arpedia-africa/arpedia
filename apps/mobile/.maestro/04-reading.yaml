# Flow 04 happy path (Done when): sign in as Ngozi, open A House Called Grace in the reader, read to
# the end of the free preview, choose Pay as you read, turn into the first locked chapter with
# Auto-unlock on (charged once, toast with Undo), highlight a passage, restart the app and come back
# to the same place with the highlight there.
# Needs the local stack (Supabase + api Worker with sealed seed files in local R2) behind the app,
# freshly reset (`pnpm db:reset`, then `node tools/seed-reader-files.mjs` to seal the seed books into
# local R2 and seed their chapter keys; `--supabase http://127.0.0.1:55621` for the second stack): the first width pays for the chapter, later widths re-read it free.
# Run: maestro test apps/mobile/.maestro/04-reading.yaml -e WIDTH=375
# All widths: node tools/maestro-widths.mjs apps/mobile/.maestro/04-reading.yaml
appId: com.arpedia.reader
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 30000
- tapOn: 'you@example.com'
- inputText: 'ngozi@example.com'
- tapOn: 'Your password'
- inputText: 'arpedia-local'
- hideKeyboard
- tapOn: 'Log in'
- tapOn:
    text: 'Don.t allow'
    optional: true
- extendedWaitUntil:
    visible: 'Home'
    timeout: 30000

# s-reader (A House Called Grace, seed id …c000-000000000003): first page, footer percent.
- openLink: arpedia://read/00000000-0000-4000-c000-000000000003
- extendedWaitUntil:
    visible: 'A House Called Grace'
    timeout: 30000
- extendedWaitUntil:
    visible: '\d+%'
    timeout: 30000
- tapOn:
    text: 'OK'
    optional: true
- takeScreenshot: reading-${WIDTH}-first-page

# Read to the preview cut: the card shows in the page flow and forward moves are held.
- repeat:
    while:
      notVisible: 'You.ve read the free .*'
    times: 80
    commands:
      - swipe:
          direction: LEFT
          duration: 200
- assertVisible: 'Unlock all · .* credits'
- takeScreenshot: reading-${WIDTH}-preview-end

# Pay as you read (money stated before the tap), then Start reading: nothing is charged yet.
- runFlow:
    when:
      visible: 'Pay as you read · about .* a chapter'
    commands:
      - tapOn: 'Pay as you read · about .* a chapter'
      - extendedWaitUntil:
          visible: 'Start reading'
          timeout: 10000
      - assertVisible: 'Most you.ll ever pay'
      - tapOn: 'Start reading'

# Auto-unlock on: the first forward move off a locked chapter's first page charges it once.
# The toast shows a few seconds after the charge (keys + state refresh) and lives 8 s, while one
# hierarchy read of the reader takes 4–12 s on the phone. So after every swipe, poll for the
# toast's Undo for a while ("Undo" shows only in the unlock toast here) instead of checking once.
# Remember a sighting in a flag: re-checking "Undo" in the loop condition can come after the toast
# has gone (seen on the emulator, 21 Nov: Undo found at 12:01:18, the condition read at 12:01:36).
- evalScript: ${output.unlocked = false}
- repeat:
    while:
      true: ${!output.unlocked}
    times: 40
    commands:
      - swipe:
          direction: LEFT
          duration: 200
      - repeat:
          while:
            true: ${!output.unlocked}
          times: 2
          commands:
            - runFlow:
                when:
                  visible: 'Undo'
                commands:
                  - evalScript: ${output.unlocked = true}
- assertTrue: ${output.unlocked}
- takeScreenshot: reading-${WIDTH}-unlocked

# Highlight: long-press a word, the toolbar shows, the first swatch highlights at once.
- longPressOn:
    point: '50%,45%'
- extendedWaitUntil:
    visible: 'Discuss'
    timeout: 10000
- takeScreenshot: reading-${WIDTH}-toolbar
- tapOn:
    id: 'Yellow'
    optional: true
- tapOn:
    text: 'Yellow'
    optional: true
- assertNotVisible: 'Discuss'

# Restart: same page, the highlight is there (tap it: its menu opens with Delete).
- stopApp
- launchApp
# Wait for Home's data (the greeting), not just the tab label: a link sent in the first second
# of a cold start reaches Android before JS listens and is dropped (emulator 360dp, 21 Nov).
- extendedWaitUntil:
    visible: 'Good .*, Ngozi.*'
    timeout: 30000
- openLink: arpedia://read/00000000-0000-4000-c000-000000000003
- extendedWaitUntil:
    visible: 'Chapter .*'
    timeout: 30000
- takeScreenshot: reading-${WIDTH}-reopened
- tapOn:
    point: '50%,45%'
- extendedWaitUntil:
    visible: 'Delete'
    timeout: 10000
- takeScreenshot: reading-${WIDTH}-highlight-menu
