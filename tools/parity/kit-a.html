<!-- Parity page kit-a: the prototype's own elements (verbatim from the Design system, prototype/src/06-tail.html).
     Only the .pk / .pk-row wrappers are harness layout; apps/mobile/app/parity.tsx mirrors them exactly. -->
<div class="hero">
  <div class="hero__bar">
    <span class="wm"
      ><svg width="26" height="26" aria-hidden="true"><use href="#i-appicon" /></svg
      ><span class="wmk wmk--night" role="img" aria-label="arpedia" style="height: 20px"></span></span
    ><span class="pill night">840</span>
  </div>
  <div class="hero__body">
    <span class="hero__title">Hero band</span
    ><span class="hero__sub">Main tabs, book and author pages, celebrations.</span>
  </div>
</div>
<div class="pk">
  <span class="btn btn-p block">Primary</span>
  <span class="btn btn-s block">Secondary</span>
  <span class="btn btn-n block">Night</span>
  <span class="btn btn-g block">Outline</span>
  <span class="btn dis block">Disabled</span>
  <span class="btn btn-x block">Destructive</span>
  <div class="pk-row"><span class="btn btn-p md">Medium</span><span class="btn btn-p sm">Small</span></div>
  <div class="pk-row">
    <span class="chip on">Selected filter</span><span class="chip">Filter</span
    ><span class="chip sel">Chosen option</span>
  </div>
  <div class="pk-row">
    <span class="pill">840 credits</span><span class="pill night">Live</span><span class="pill ok">Live</span
    ><span class="pill info">In review</span>
  </div>
  <div class="pk-row">
    <button class="toggle on" aria-label="On example"></button
    ><button class="toggle" aria-label="Off example"></button>
  </div>
</div>
