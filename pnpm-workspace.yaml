packages:
  - apps/*
  - packages/*
  - workers/*
  - tools/desk

# React Native and Metro expect a flat node_modules.
minimumReleaseAgeExclude:
  - '@supabase/cli-darwin-arm64@3.2.0'
  - '@supabase/cli-darwin-x64@3.2.0'
  - '@supabase/cli-linux-arm64-musl@3.2.0'
  - '@supabase/cli-linux-arm64@3.2.0'
  - '@supabase/cli-linux-x64-musl@3.2.0'
  - '@supabase/cli-linux-x64@3.2.0'
  - '@supabase/cli-windows-arm64@3.2.0'
  - '@supabase/cli-windows-x64@3.2.0'
  - '@typescript-eslint/eslint-plugin@8.73.0'
  - '@typescript-eslint/parser@8.73.0'
  - '@typescript-eslint/project-service@8.73.0'
  - '@typescript-eslint/scope-manager@8.73.0'
  - '@typescript-eslint/tsconfig-utils@8.73.0'
  - '@typescript-eslint/type-utils@8.73.0'
  - '@typescript-eslint/types@8.73.0'
  - '@typescript-eslint/typescript-estree@8.73.0'
  - '@typescript-eslint/utils@8.73.0'
  - '@typescript-eslint/visitor-keys@8.73.0'
  - supabase@3.2.0
  - typescript-eslint@8.73.0

nodeLinker: hoisted

onlyBuiltDependencies:
  - esbuild
  - supabase
  - workerd
  - sharp
  - unrs-resolver
