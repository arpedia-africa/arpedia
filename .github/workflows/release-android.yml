# Android releases through fastlane (apps/mobile/fastlane/Fastfile).
#   internal     build and upload to the Play internal track: by hand, or by a release tag v*
#   closed       promote the newest internal build to the closed beta track
#   production   one rollout step (5, 20, 50, 100%): only from a release tag, only by an approver
#   halt         stop the production rollout
# Needs repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD, PLAY_JSON_KEY (service account JSON), plus EXPO_PUBLIC_* variables.
# Approval (flow 17 rule 13): production and halt run in the `production` environment (add the
# owner as a required reviewer there when the plan allows it) and only for logins listed in the
# RELEASE_APPROVERS variable (comma-separated), so nobody else can start a rollout.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Lane
        type: choice
        options: [internal, closed, production, halt]
        default: internal
      percent:
        description: Rollout percent (production only)
        type: choice
        options: ['5', '20', '50', '100']
        default: '5'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  internal:
    if: github.event_name == 'push' || inputs.lane == 'internal'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - run: pnpm install --frozen-lockfile
      - name: Signing files
        working-directory: apps/mobile
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_JSON_KEY }}
        run: |
          echo "$KEYSTORE" | base64 -d > upload.keystore
          echo "$PLAY_JSON" > play.json
      - name: Build and upload to Play internal
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PATH: upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON_KEY_PATH: play.json
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_KEY }}
        run: bundle exec fastlane android internal
      - name: Keep the bundle for preflight
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Remove signing files
        if: always()
        working-directory: apps/mobile
        run: rm -f upload.keystore play.json

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.lane != 'internal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (inputs.lane == 'production' || inputs.lane == 'halt') && 'production' || 'release' }}
    steps:
      - name: Only approvers, and production only from a release tag
        env:
          LANE: ${{ inputs.lane }}
          APPROVERS: ${{ vars.RELEASE_APPROVERS }}
        run: |
          if [ "$LANE" = production ] || [ "$LANE" = halt ]; then
            case ",${APPROVERS// /}," in *",$GITHUB_ACTOR,"*) ;; *)
              echo "::error::$GITHUB_ACTOR is not in RELEASE_APPROVERS"; exit 1;; esac
          fi
          if [ "$LANE" = production ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Production runs only from a release tag (Run workflow → Use workflow from → a v* tag)"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - name: Play service account
        working-directory: apps/mobile
        env:
          PLAY_JSON: ${{ secrets.PLAY_JSON_KEY }}
        run: echo "$PLAY_JSON" > play.json
      - name: fastlane android ${{ inputs.lane }}
        working-directory: apps/mobile
        env:
          PLAY_JSON_KEY_PATH: play.json
          LANE: ${{ inputs.lane }}
          PERCENT: ${{ inputs.percent }}
        run: |
          if [ "$LANE" = production ]; then bundle exec fastlane android production "percent:$PERCENT"
          else bundle exec fastlane android "$LANE"; fi
      - name: Remove signing files
        if: always()
        working-directory: apps/mobile
        run: rm -f play.json

  validate-lanes:
    # Every lane's logic, with no build and no call to Play (DRY_RUN).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - working-directory: apps/mobile
        run: bundle exec bash fastlane/validate.sh
