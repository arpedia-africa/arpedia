<title>Arpedia Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Arpedia Admin console prototype. Desktop-first web console, light single look (staff work in daylight offices).
   Brand tokens identical to the app (DESIGN.md). Prototype chrome (top strip, screen index, feedback) is theme-aware. */
:root{
  --pg-bg:#f6f6f7; --pg-fg:#14161a; --pg-muted:#5b616b; --pg-line:#e2e4e8; --pg-card:#ffffff; --pg-chip:#eceef1; --pg-hi:#FDEEDB; --pg-hi-fg:#7a3f00;
  --org:#F5931F; --org-ink:#9A4F00; --org-tint:#FDEEDB; --org-tint-2:#FFF6EA; --night:#1A1100; --on-org:#4A2600; --night-2:#2A1D08; --night-3:#3B2A10;
  --ink:#111827; --ink-2:#4B5563; --ink-3:#6B7280; --line:#E5E7EB; --line-2:#EEF0F3; --surface:#F3F4F6; --canvas:#F7F7F8; --white:#FFFFFF;
  --sun:#F9C623; --brown:#6B3F1D; --olive:#5F6B3A; --mauve:#8B5E83; --slate:#263238;
  --ok:#15803D; --ok-t:#DCFCE7; --warn:#B45309; --warn-t:#FEF3C7; --err:#B91C1C; --err-t:#FEE2E2; --info:#1D4ED8; --info-t:#DBEAFE; --live:#4ADE80;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-d:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --f-r:"Literata",Georgia,"Times New Roman",serif;
  --f-m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --petal-ring:repeating-conic-gradient(rgba(255,214,90,.72) 0 14deg,transparent 14deg 30deg);
  --z-sticky:10; --z-side:20; --z-pop:30; --z-backdrop:40; --z-modal:50; --z-toast:60; --z-proto:100;
  --pbar-h:48px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg-bg:#111214;--pg-fg:#eceef1;--pg-muted:#a3a9b3;--pg-line:#2a2d32;--pg-card:#1a1c1f;--pg-chip:#24272b;--pg-hi:#3a2a14;--pg-hi-fg:#ffd7a3;color-scheme:dark}}
:root[data-theme="dark"]{--pg-bg:#111214;--pg-fg:#eceef1;--pg-muted:#a3a9b3;--pg-line:#2a2d32;--pg-card:#1a1c1f;--pg-chip:#24272b;--pg-hi:#3a2a14;--pg-hi-fg:#ffd7a3;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--pg-bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--org);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:middle}
.ico.s{width:18px;height:18px}.ico.xs{width:15px;height:15px}.ico.l{width:24px;height:24px}
.ico.fill{fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-m);font-size:12.5px}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.ok-t{color:var(--ok)}.err-t{color:var(--err)}.warn-t{color:var(--warn)}.org-t{color:var(--org-ink)}
.disp{font-family:var(--f-d);font-weight:800;letter-spacing:-0.02em}

/* ================= Prototype chrome ================= */
.pbar{position:fixed;inset:0 0 auto;height:calc(var(--pbar-h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;background:var(--pg-card);color:var(--pg-fg);border-bottom:1px solid var(--pg-line);z-index:var(--z-proto)}
.pbtn{border:1px solid var(--pg-line);background:var(--pg-card);color:var(--pg-fg);border-radius:10px;height:34px;padding:0 10px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pbtn:hover{background:var(--pg-chip)}
.pbtn.ib{width:34px;padding:0;justify-content:center}
.pcur{flex:1;min-width:0;text-align:center;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--pg-fg)}
.pcur small{display:block;color:var(--pg-muted);font-weight:500;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.pbrand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--pg-fg);padding-right:4px}
.pbrand small{color:var(--pg-muted);font-weight:500}
.pidx{position:fixed;top:calc(var(--pbar-h) + env(safe-area-inset-top,0px));left:0;bottom:0;width:min(340px,100%);background:var(--pg-card);color:var(--pg-fg);border-right:1px solid var(--pg-line);z-index:var(--z-proto);overflow:auto;padding:14px 12px 40px max(12px,env(safe-area-inset-left,0px));transform:translateX(-102%);visibility:hidden;transition:transform .22s var(--ease),visibility 0s linear .22s;box-shadow:20px 0 50px -24px rgba(0,0,0,.35)}
.pidx.open{transform:none;visibility:visible;transition:transform .22s var(--ease)}
.pidx h3{font-size:12px;font-weight:700;color:var(--pg-muted);padding:10px 10px 4px;display:flex;gap:8px}
.pidx h3 span{opacity:.6;font-variant-numeric:tabular-nums}
.pidx a{display:block;padding:5px 10px 5px 30px;border-radius:8px;color:var(--pg-fg);text-decoration:none;font-size:13px}
.pidx a:hover{background:var(--pg-chip)}
.pidx a[aria-current="true"]{background:var(--pg-hi);color:var(--pg-hi-fg);font-weight:600}
.pnotes{position:fixed;top:calc(var(--pbar-h) + env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 20px));max-height:70vh;overflow:auto;background:var(--pg-card);color:var(--pg-fg);border:1px solid var(--pg-line);border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35);padding:16px 18px;z-index:var(--z-proto);display:flex;flex-direction:column;gap:10px}
.pnotes h2{font-family:var(--f-d);font-weight:800;font-size:20px}
.pnotes .n-area{font-size:12px;color:var(--pg-muted);font-weight:600}
.pnotes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--pg-muted)}
.pnotes .tag{display:inline-block;background:var(--pg-hi);color:var(--pg-hi-fg);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:4px}
@media (max-width:760px){.pbrand,.pbtn .lbl{display:none}}

/* ================= Console frame ================= */
.console{position:fixed;inset:calc(var(--pbar-h) + env(safe-area-inset-top,0px)) 0 0 0;display:grid;grid-template-columns:248px minmax(0,1fr);background:var(--canvas)}
.console.is-full{grid-template-columns:minmax(0,1fr)}
.console.is-full .side,.console.is-full .topbar{display:none}
.side{background:var(--night);color:#F3E9DA;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;padding-left:env(safe-area-inset-left,0px)}
.side::before{content:"";position:absolute;left:-120px;bottom:-130px;width:260px;height:260px;border-radius:50%;background:var(--petal-ring);-webkit-mask:radial-gradient(circle,transparent 0 22%,#000 23%);mask:radial-gradient(circle,transparent 0 22%,#000 23%);opacity:.14;pointer-events:none}
.side__brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.side__brand b{font-family:var(--f-d);font-weight:800;font-size:19px;letter-spacing:-0.02em;color:#fff}
.side__brand small{display:block;font-size:11.5px;color:#C9B89C;font-weight:500;margin-top:-2px}
.env{margin:0 16px 10px;display:flex;align-items:center;gap:8px;font-size:12px;color:#C9B89C}
.env b{color:#fff;font-weight:600}
.env .dot{width:8px;height:8px;border-radius:50%;background:var(--live)}
.side__nav{flex:1;overflow:auto;padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;scrollbar-width:thin;scrollbar-color:#4a3a20 transparent}
.side__grp{font-size:11.5px;font-weight:600;color:#A8977B;padding:14px 10px 4px}
.side__item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:#EDE2D0;text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer}
.side__item .ico{width:18px;height:18px;color:#C9B89C}
.side__item:hover{background:var(--night-2)}
.side__item[aria-current="page"]{background:var(--org);color:var(--on-org);font-weight:700}
.side__item[aria-current="page"] .ico{color:var(--on-org)}
.side__item .cnt{margin-left:auto;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 7px;border-radius:999px;background:var(--night-3);color:#F3E9DA}
.side__item .cnt.hot{background:var(--org);color:var(--on-org)}
.side__item[aria-current="page"] .cnt{background:var(--night);color:#fff}
.side__sec{display:flex;flex-direction:column}
.side__sub{display:none;flex-direction:column;gap:1px;padding:2px 0 8px 28px}
.side__sec.open .side__sub{display:flex}
.side__sub a{display:block;padding:6px 10px;border-radius:8px;color:#D9CBB3;text-decoration:none;font-size:13px;cursor:pointer}
.side__sub a:hover{background:var(--night-2);color:#fff}
.side__sub a[aria-current="page"]{color:#fff;font-weight:700;background:var(--night-3)}
.side__sec.open > .side__item:not([aria-current="page"]){color:#fff;font-weight:700}
.side__sec.open > .side__item:not([aria-current="page"]) .ico{color:var(--org)}
.side__me{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--night-3);position:relative;z-index:1;text-decoration:none;color:inherit;cursor:pointer}
.side__me b{display:block;font-size:13px;color:#fff}
.side__me small{display:block;font-size:11.5px;color:#C9B89C}
.workspace{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 20px;background:var(--white);border-bottom:1px solid var(--line);position:relative;z-index:var(--z-sticky)}
.topbar .topmenu{display:none}
.gsearch{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface);color:var(--ink-3);cursor:pointer;text-decoration:none;font-size:13.5px}
.gsearch span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsearch kbd{margin-left:auto;font-family:var(--f-ui);font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--white);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.topbar .spacer{flex:1}
.view{flex:1;min-height:0;overflow:auto;position:relative;scroll-behavior:smooth}
.screen{min-height:100%;display:flex;flex-direction:column}
.screen.overlay{position:absolute;inset:0;min-height:0;z-index:var(--z-modal);display:block}
.console.is-full .view{background:var(--org)}
@media (max-width:980px){
  .console{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:calc(var(--pbar-h) + env(safe-area-inset-top,0px));bottom:0;left:0;width:264px;z-index:var(--z-side);transform:translateX(-102%);visibility:hidden;transition:transform .22s var(--ease),visibility 0s linear .22s}
  .side.open{transform:none;visibility:visible;transition:transform .22s var(--ease);box-shadow:30px 0 60px -20px rgba(0,0,0,.45)}
  .topbar .topmenu{display:grid}
  .topbar{padding-left:max(12px,env(safe-area-inset-left,0px))}
  .gsearch kbd{display:none}
}
@media (max-width:640px){.topbar .btn{display:none}}

/* ================= Page structure ================= */
.page{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1360px;width:100%}
.page--narrow{max-width:960px}
@media (max-width:760px){.page{padding:18px 16px 40px}}
/* Page header: plain white everywhere; the orange petal band is reserved for Home (.band--home) and Sign in */
.band{background:var(--white);color:var(--ink);position:relative;overflow:hidden;padding:18px 28px 16px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.band > *{position:relative;z-index:1}
.band__row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1304px}
.band__text{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.band h1{font-family:var(--f-d);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-0.02em}
.band p{display:none}
.band__acts{display:flex;gap:8px;flex-wrap:wrap}
.band + .tabs{margin-top:-1px}
.band--home{background:var(--org);color:var(--on-org);padding:26px 28px 24px;border-bottom:0}
.band--home::after{content:"";position:absolute;right:-90px;top:-130px;width:300px;height:300px;border-radius:50%;background:var(--petal-ring);-webkit-mask:radial-gradient(circle,transparent 0 22%,#000 23%);mask:radial-gradient(circle,transparent 0 22%,#000 23%);opacity:.55;pointer-events:none}
.band--home h1{font-size:30px;line-height:1.05}
.band--home p{display:block;font-size:15px;color:rgba(74,38,0,.85);max-width:70ch}
.band--home .btn-g{box-shadow:none}
@media (max-width:760px){.band{padding:14px 16px}.band h1{font-size:22px}.band--home{padding:20px 16px}.band--home h1{font-size:25px}}
.ph{padding:20px 28px 0;display:flex;flex-direction:column;gap:6px;max-width:1360px}
.ph__row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ph__title{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}
.ph h1{font-family:var(--f-d);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph__meta{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px 14px;flex-wrap:wrap}
.ph__acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){.ph{padding:16px 16px 0}.ph h1{font-size:22px}}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.crumbs a{color:var(--ink-2);text-decoration:none;font-weight:600;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs .ico{width:14px;height:14px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding:0 28px;background:var(--white);flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{border:0;background:none;padding:12px 12px 11px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;cursor:pointer;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.tabs a:hover,.tabs button:hover{color:var(--ink)}
.tabs [aria-selected="true"]{color:var(--ink);border-bottom-color:var(--org);font-weight:700}
.tabs .c{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-variant-numeric:tabular-nums}
.tabs [aria-selected="true"] .c{background:var(--night);color:#fff}
.tabs--inline{padding:0;background:none}
@media (min-width:761px){.tabs{overflow:visible}}
@media (max-width:760px){.tabs{padding:0 12px}}

/* layout helpers */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.split--wide{grid-template-columns:minmax(0,1fr) 400px}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.split--wide{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.s4{gap:4px}.stack.s8{gap:8px}.stack.s16{gap:16px}.stack.s20{gap:20px}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* ================= Atoms ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:0;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s var(--ease),box-shadow .15s var(--ease)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px;gap:6px}
.btn.lg{height:48px;padding:0 22px;font-size:15px}
.btn.block{width:100%}
.btn-p{background:var(--org);color:var(--on-org)}.btn-p:hover{background:#E8850F}
.btn-n{background:var(--night);color:#fff}.btn-n:hover{background:var(--night-3)}
.btn-s{background:var(--org-tint);color:var(--org-ink)}.btn-s:hover{background:#FBE2C2}
.btn-g{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.btn-g:hover{background:var(--surface)}
.btn-q{background:transparent;color:var(--ink-2)}.btn-q:hover{background:var(--surface);color:var(--ink)}
.btn-d{background:var(--white);color:var(--err);box-shadow:inset 0 0 0 1px #F3C1C1}.btn-d:hover{background:var(--err-t)}
.btn-dd{background:var(--err);color:#fff}.btn-dd:hover{background:#991B1B}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#166534}
.band .btn-g{box-shadow:none}
.btn[aria-disabled="true"],.btn.dis{background:var(--surface);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);text-decoration:none;position:relative;flex:0 0 auto}
.ib:hover{background:var(--surface);color:var(--ink)}
.ib.sm{width:32px;height:32px;border-radius:10px}
.ib .badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--org);color:var(--on-org);font-size:10px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.link{color:var(--org-ink);font-weight:600;text-decoration:none;cursor:pointer}
.link:hover{text-decoration:underline}

/* status pills: text + dot, never color alone */
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface);color:var(--ink-2)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.st.nodot::before{display:none}
.st-ok{background:var(--ok-t);color:var(--ok)}
.st-warn{background:var(--warn-t);color:var(--warn)}
.st-err{background:var(--err-t);color:var(--err)}
.st-info{background:var(--info-t);color:var(--info)}
.st-org{background:var(--org-tint);color:var(--org-ink)}
.st-night{background:var(--night);color:#fff}
.st-night::before{background:var(--live)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.tag.org{background:var(--org-tint);color:var(--org-ink)}
.cnt-b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--night);color:#fff;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt-b.org{background:var(--org);color:var(--on-org)}

/* avatars and covers (same as app) */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto}
.av.sm{width:28px;height:28px;font-size:10.5px}.av.xs{width:22px;height:22px;font-size:9px}.av.lg{width:56px;height:56px;font-size:18px}.av.xl{width:80px;height:80px;font-size:26px}
.av.m{background:var(--mauve)}.av.o{background:var(--olive)}.av.b{background:var(--brown)}.av.t{background:#1F6F78}.av.r{background:#A23B2A}.av.k{background:#3F4A8A}.av.n{background:var(--night)}.av.g{background:#C26A12}
.avs{display:flex}.avs .av{margin-left:-8px;box-shadow:0 0 0 2px var(--white)}.avs .av:first-child{margin-left:0}
.cv{border-radius:5px;position:relative;overflow:hidden;flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;color:#fff;box-shadow:0 6px 12px -8px rgba(0,0,0,.5),inset 3px 0 0 rgba(255,255,255,.18);font-family:var(--f-r);text-decoration:none}
.cv b{font-weight:600;font-size:11px;line-height:1.15;display:block}
.cv small{font-family:var(--f-ui);font-size:7px;opacity:.85;letter-spacing:.05em;margin-top:3px;display:block;text-transform:uppercase}
.cv.c1{background:linear-gradient(160deg,#C9772B,#7A2E14)}.cv.c2{background:linear-gradient(170deg,#1F4D3F,#0E2620)}.cv.c3{background:linear-gradient(165deg,#F4EFE6,#E3DACB);color:#8E1111}.cv.c3 small{color:#222}.cv.c4{background:linear-gradient(170deg,#30386E,#141836)}.cv.c5{background:linear-gradient(160deg,#8C2D4B,#3F0F22)}.cv.c6{background:linear-gradient(170deg,#D9A21B,#8A5A08)}.cv.c7{background:linear-gradient(165deg,#0F766E,#134E4A)}.cv.c8{background:linear-gradient(160deg,#4B2A6B,#1E1030)}
.cv.c1::before,.cv.c6::before{content:"";position:absolute;right:-22%;top:-14%;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35) 0 28%,transparent 29%),repeating-conic-gradient(rgba(255,255,255,.22) 0 12deg,transparent 12deg 30deg)}
.cv.c2::before{content:"";position:absolute;left:6px;right:6px;top:14%;height:1px;background:rgba(255,255,255,.5);box-shadow:0 5px 0 rgba(255,255,255,.3)}
.cv.c4::before{content:"";position:absolute;left:50%;top:20%;width:46%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;border:1.5px solid rgba(255,255,255,.5)}
.cv.c5::before{content:"";position:absolute;inset:auto -10px 42% -10px;height:22%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 6px,transparent 6px 12px)}
.cv.c3::before{content:"";position:absolute;left:22%;top:8%;width:56%;height:52%;background:linear-gradient(135deg,transparent 45%,#111 46% 54%,transparent 55%),linear-gradient(45deg,transparent 45%,#111 46% 54%,transparent 55%)}
.cv.c7::before{content:"";position:absolute;inset:12% 12% auto;height:34%;border-radius:50% 50% 0 0;border:1.5px solid rgba(255,255,255,.45);border-bottom:0}
.cv.c8::before{content:"";position:absolute;left:0;right:0;top:18%;height:30%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 4px,transparent 4px 10px)}
.cv.x32{width:32px;height:48px;padding:3px}.cv.x40{width:40px;height:60px}.cv.x56{width:56px;height:84px}.cv.x80{width:80px;height:120px}.cv.x120{width:120px;height:180px}.cv.x160{width:160px;height:240px;padding:12px}
.cv.x32 b,.cv.x32 small,.cv.x40 small{display:none}.cv.x40 b{font-size:7px}
.cv.x120 b{font-size:14px}.cv.x160 b{font-size:18px}.cv.x160 small{font-size:9px}
